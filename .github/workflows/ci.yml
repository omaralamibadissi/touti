# CI : à chaque push ou PR, on vérifie que le projet compile et que les
# tests passent. Couvre les 3 workspaces (shared / server / mobile).
#
# Durée typique : ~1-2 min (install npm + typecheck + jest sur shared).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # Annule les runs plus anciens sur la même branche (économise les minutes)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (shared + server + mobile)
        run: npm run typecheck

      - name: Tests (engine de jeu)
        run: npm test
